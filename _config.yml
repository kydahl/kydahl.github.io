# Site settings
title: "Kyle Dahlin"
description: "Mathematical Modeling | Epidemiology | Vector-Borne Disease Research"
url: "https://kydahl.github.io"  # Your actual site URL
baseurl: ""  # Keep empty unless using a project page

# Use Minimal Mistakes as a remote theme
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"  # Can change to "dark", "air", "contrast", etc.

# Author settings
author:
  name: "Kyle Dahlin"
  # avatar: "/assets/images/profile.jpg"  # Ensure this image exists in assets/images/
  bio: "Applied mathematician studying mosquito-borne disease transmission."
  location: "United States"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/kydahl"
    - label: "Google Scholar"
      icon: "fas fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=--CIqWgAAAAJ"
    - label: "ResearchGate"
      icon: "fab fa-researchgate"
      url: "https://www.researchgate.net/profile/Kyle-Dahlin"

# Navigation bar settings
nav_links:
  - title: "Home"
    url: "/"
  - title: "Research"
    url: "/research_publications/"
  - title: "Teaching"
    url: "/teaching/"
  - title: "Contact"
    url: "/contact/"

# GitHub Pages-approved plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

# Ensure _pages directory is included
include:
  - _pages

# Output settings
markdown: kramdown
highlighter: rouge

# Disable the theme's default header text (optional)
theme_settings:
  show_header_text: false